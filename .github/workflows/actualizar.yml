name: Actualizar trombinoscopios

# IMPORTANTE: los runners de GitHub reciben 403 de senado.es (Akamai bloquea los
# rangos de centro de datos). Comprobado en la ejecucion #5. Por eso aqui solo se
# generan las paginas del Congreso, que si son alcanzables.
#
# Las tres del Senado se generan desde tu maquina y se suben:
#     python scripts/build.py senado diputacion_permanente comisiones_senado
#     git add docs/ && git commit -m "Senado" && git push
#
# El indice detecta que ficheros existen, asi que las paginas subidas a mano
# aparecen enlazadas con normalidad y no se pisan en cada ejecucion.

on:
  schedule:
    # Lunes a las 06:15 UTC
    - cron: "15 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/actualizar.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: trombinoscopio
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Comprobar acceso a las fuentes oficiales
        run: |
          echo "Congreso:"; curl -sS -o /dev/null -w "  HTTP %{http_code}\n" \
            -A "Mozilla/5.0" https://www.congreso.es/es/busqueda-de-diputados || true
          echo "Senado (se espera 403 desde los runners):"
          curl -sS -o /dev/null -w "  HTTP %{http_code}\n" \
            -A "Mozilla/5.0" https://www.senado.es/web/index.html || true

      - name: Generar las paginas del Congreso
        run: python scripts/build.py congreso comisiones_congreso

      - name: Commitear los cambios en docs/
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "Sin cambios que commitear."
          else
            git commit -m "Actualizacion automatica del Congreso ($(date +%d/%m/%Y))"
            git pull --rebase origin main
            git push
          fi

      - name: Subir el sitio para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  publicar:
    needs: generar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v4
