name: Actualizar trombinoscopios

on:
  schedule:
    # Lunes a las 06:15 UTC (07:15 en invierno, 08:15 en verano, hora peninsular)
    - cron: "15 6 * * 1"
  workflow_dispatch:        # permite lanzarlo a mano desde la pestana Actions
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/actualizar.yml"

permissions:
  contents: write           # para commitear docs/
  pages: write
  id-token: write

concurrency:
  group: trombinoscopio
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Comprobar acceso a las fuentes oficiales
        run: |
          echo "Congreso:"; curl -sS -o /dev/null -w "  HTTP %{http_code}\n" \
            -A "Mozilla/5.0" https://www.congreso.es/es/busqueda-de-diputados || true
          echo "Senado:";   curl -sS -o /dev/null -w "  HTTP %{http_code}\n" \
            -A "Mozilla/5.0" https://www.senado.es/web/index.html || true

      - name: Generar los trombinoscopios
        id: generar
        continue-on-error: true
        run: python scripts/build.py

      - name: Commitear los cambios en docs/
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "Sin cambios que commitear."
          else
            git commit -m "Actualizacion automatica de los trombinoscopios ($(date +%d/%m/%Y))"
            git push
          fi

      - name: Subir el sitio para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Fallar si alguna camara no se pudo generar
        if: steps.generar.outcome == 'failure'
        run: |
          echo "::error::Alguna de las camaras no se ha podido actualizar."
          echo "Revisa el log del paso 'Generar los trombinoscopios'."
          exit 1

  publicar:
    needs: generar
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v4

